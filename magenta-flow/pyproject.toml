[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "magenta-flow"
version = "0.1.0"
description = "Standalone Magenta RealTime 2 audio-to-monophonic-MIDI prototype"
requires-python = ">=3.11,<3.13"
dependencies = [
  "magenta-rt[mlx]==2.0.3",
  "librosa>=0.11,<1",
  "mido>=1.3,<2",
  "numpy>=1.26,<3",
  "python-rtmidi>=1.5,<2",
  "sounddevice>=0.5,<1",
  "soundfile>=0.12,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
magenta-flow = "magenta_flow.cli:main"

[tool.setuptools.packages.find]
include = ["magenta_flow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

